<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 23 - IMC</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body style="background-color: transparent;">
    <div class="tarjeta-formulario" style="max-width: 600px; margin: 30px auto;">
        <h2 style="color: var(--uas-azul);">Ejercicio 23: Índice de Masa Corporal (Mujer)</h2>
        <p>Calculadora de salud basada en parámetros de la OMS.</p>
        <hr>

        <form id="form-imc">
            <div style="display: flex; gap: 15px;">
                <div class="grupo-form" style="flex: 1;">
                    <label>Peso (kg):</label>
                    <input type="number" id="peso" step="0.1" placeholder="Ej. 65.5" required>
                </div>
                <div class="grupo-form" style="flex: 1;">
                    <label>Estatura (metros):</label>
                    <input type="number" id="estatura" step="0.01" placeholder="Ej. 1.68" required>
                </div>
            </div>
            <div class="btn-contenedor">
                <button type="button" class="btn" style="width: 100%;" onclick="calcularIMC()">Calcular Diagnóstico</button>
            </div>
        </form>

        <div id="resultado-imc" style="margin-top: 25px; padding: 20px; border-radius: 8px; text-align: center; font-size: 18px; display: none;">
            </div>
    </div>

    <script>
        function calcularIMC() {
            const peso = parseFloat(document.getElementById('peso').value);
            const estatura = parseFloat(document.getElementById('estatura').value);
            const cajaRes = document.getElementById('resultado-imc');

            if (isNaN(peso) || isNaN(estatura) || estatura <= 0) {
                alert("Por favor ingrese valores numéricos válidos.");
                return;
            }

            // Procesamiento
            const imc = peso / Math.pow(estatura, 2);
            let diagnostico = "";
            let colorFondo = "";
            let colorTexto = "";

            // Lógica de rangos (Clasificación OMS)
            if (imc < 18.5) {
                diagnostico = "Bajo Peso";
                colorFondo = "#cce5ff"; colorTexto = "#004085";
            } else if (imc >= 18.5 && imc <= 24.9) {
                diagnostico = "Peso Normal (Saludable)";
                colorFondo = "#d4edda"; colorTexto = "#155724";
            } else if (imc >= 25.0 && imc <= 29.9) {
                diagnostico = "Sobrepeso";
                colorFondo = "#fff3cd"; colorTexto = "#856404";
            } else {
                diagnostico = "Obesidad";
                colorFondo = "#f8d7da"; colorTexto = "#721c24";
            }

            // Inyección al DOM
            cajaRes.style.display = "block";
            cajaRes.style.backgroundColor = colorFondo;
            cajaRes.style.color = colorTexto;
            cajaRes.style.border = `2px solid ${colorTexto}`;
            cajaRes.innerHTML = `<strong>IMC: ${imc.toFixed(2)}</strong><br><span style="font-size: 22px;">${diagnostico}</span>`;
        }
    </script>
</body>
</html>
