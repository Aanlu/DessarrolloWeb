<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 21 - Formularios Dinámicos</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="tarjeta-formulario" style="max-width: 600px; margin: 40px auto;">
        <h2 style="color: var(--uas-azul);">Ejercicio 21: Calculadora Interactiva</h2>
        
        <form id="form-calc">
            <div style="display: flex; gap: 15px;">
                <div class="grupo-form" style="flex: 1;">
                    <label>Valor 1:</label>
                    <input type="number" id="val1" step="any" required>
                </div>
                <div class="grupo-form" style="flex: 1;">
                    <label>Valor 2:</label>
                    <input type="number" id="val2" step="any" required>
                </div>
            </div>
            
            <div class="btn-contenedor" style="justify-content: center; flex-wrap: wrap;">
                <button type="button" class="btn" onclick="calcular('+')">Sumar</button>
                <button type="button" class="btn" onclick="calcular('-')">Restar</button>
                <button type="button" class="btn" onclick="calcular('/')">Dividir</button>
                <button type="button" class="btn" onclick="calcular('**')">Exponenciar</button>
            </div>
        </form>

        <h3 style="text-align: center; margin-top: 30px; color: var(--uas-oro);" id="res-dinamico">
            El resultado aparecerá aquí
        </h3>
    </div>

    <script>
        function calcular(operacion) {
            // Lectura y conversión estricta a números flotantes
            const v1 = parseFloat(document.getElementById('val1').value);
            const v2 = parseFloat(document.getElementById('val2').value);
            const salida = document.getElementById('res-dinamico');

            if (isNaN(v1) || isNaN(v2)) {
                salida.innerText = "Error: Ingrese ambos valores numéricos.";
                salida.style.color = "red";
                return;
            }

            let resultado = 0;

            // Enrutador de operaciones
            switch (operacion) {
                case '+': resultado = v1 + v2; break;
                case '-': resultado = v1 - v2; break;
                case '/': 
                    if (v2 === 0) {
                        salida.innerText = "Error Matemático: División por cero.";
                        salida.style.color = "red";
                        return;
                    }
                    resultado = v1 / v2; 
                    break;
                case '**': resultado = v1 ** v2; break;
            }

            salida.style.color = "var(--uas-azul)";
            salida.innerText = `Resultado: ${resultado}`;
        }
    </script>
</body>
</html>
