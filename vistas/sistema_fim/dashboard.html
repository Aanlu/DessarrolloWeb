<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Préstamos FIM</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <header>
        <h1>UAS | Sistema de Laboratorios FIM</h1>
            <nav>
                <a href="dashboard.html" class="activo">Panel de Control</a>
                <a href="equipos/catalogo.html">Inventario</a>
                <a href="usuarios/registrar_usuario.html">Usuarios</a>
                <a href="prestamos/historial.html">Préstamos</a>
            </nav>
    </header>

    <main>
        <h2>Resumen de Operaciones en Tiempo Real</h2>
        <p>Monitoreo de los equipos de la Facultad de Ingeniería Mochis.</p>
        
        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <div class="tarjeta-formulario" style="flex: 1; text-align: center; border-top: 4px solid var(--uas-oro);">
                <h3>Equipos Prestados</h3>
                <p id="kpi-prestados" style="font-size: 24px; font-weight: bold; color: var(--uas-azul);">0</p>
            </div>
            <div class="tarjeta-formulario" style="flex: 1; text-align: center; border-top: 4px solid var(--uas-oro);">
                <h3>Total en Inventario</h3>
                <p id="kpi-inventario" style="font-size: 24px; font-weight: bold; color: var(--uas-azul);">0</p>
            </div>
        </div>
        
        <h3>Últimos Movimientos</h3>
        <table>
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Matrícula</th>
                    <th>Equipo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-recientes">
                </tbody>
        </table>
    </main>

    <script>
        // Inicializar datos semilla si no existen
        if(!localStorage.getItem('equipos_fim')) {
            localStorage.setItem('equipos_fim', JSON.stringify([{id: 'FIM-LAP-001', desc: 'Laptop Acer Nitro 5', estado: 'Disponible'}]));
        }
        if(!localStorage.getItem('prestamos_fim')) {
            localStorage.setItem('prestamos_fim', JSON.stringify([{folio: 'PR-100', matricula: '2008390-8', equipo: 'FIM-LAP-05', estado: 'En Uso'}]));
        }

        // Leer datos
        const prestamos = JSON.parse(localStorage.getItem('prestamos_fim')) || [];
        const equipos = JSON.parse(localStorage.getItem('equipos_fim')) || [];

        // Actualizar KPIs
        const enUso = prestamos.filter(p => p.estado === 'En Uso').length;
        document.getElementById('kpi-prestados').innerText = enUso;
        document.getElementById('kpi-inventario').innerText = equipos.length;

        // Llenar tabla
        const tbody = document.getElementById('tabla-recientes');
        prestamos.slice(-3).reverse().forEach(p => {
            const color = p.estado === 'En Uso' ? 'red' : 'green';
            tbody.innerHTML += `<tr><td>${p.folio}</td><td>${p.matricula}</td><td>${p.equipo}</td><td style="color: ${color}; font-weight: bold;">${p.estado}</td></tr>`;
        });
    </script>
</body>
</html>
