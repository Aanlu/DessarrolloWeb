<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Web - Luis Antonio Cázares</title>
    <style>
        :root { 
            --uas-azul: #003366; 
            --uas-oro: #DAA520; 
            --sidebar-width: 260px;
            --sidebar-collapsed: 60px;
        }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #f4f6f9; 
        }

        /* BARRA LATERAL (SIDEBAR) */
        .sidebar { 
            width: var(--sidebar-width); 
            background-color: var(--uas-azul); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 100;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }

        /* Estado colapsado */
        .sidebar.collapsed { width: var(--sidebar-collapsed); }

        .sidebar-header { 
            padding: 20px; 
            text-align: center; 
            border-bottom: 3px solid var(--uas-oro);
            overflow: hidden;
            white-space: nowrap;
        }

        /* BOTÓN DE RETRACCIÓN */
        .toggle-btn {
            background: var(--uas-oro);
            border: none;
            color: var(--uas-azul);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            position: absolute;
            right: -15px;
            top: 20px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 110;
        }

        .menu-container { 
            padding: 15px; 
            overflow-y: auto; 
            flex: 1; 
            scrollbar-width: thin;
        }

        .menu-seccion { 
            font-size: 11px; 
            color: var(--uas-oro); 
            text-transform: uppercase; 
            font-weight: bold; 
            margin: 20px 0 10px 5px; 
            letter-spacing: 1px;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .menu-seccion, 
        .sidebar.collapsed .sidebar-header p,
        .sidebar.collapsed .link-text { 
            opacity: 0; 
            pointer-events: none; 
        }

        .sidebar a { 
            display: flex;
            align-items: center;
            color: white; 
            padding: 12px 15px; 
            text-decoration: none; 
            border-radius: 6px; 
            margin-bottom: 5px; 
            transition: all 0.2s; 
            font-size: 14px;
            white-space: nowrap;
        }

        .sidebar a:hover { 
            background-color: rgba(255,255,255,0.1); 
            border-left: 4px solid var(--uas-oro);
        }

        .icon-box { min-width: 30px; text-align: center; margin-right: 10px; font-weight: bold; }

        /* VISOR PRINCIPAL */
        .visor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        iframe { flex: 1; width: 100%; border: none; background-color: white; }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
        
        <div class="sidebar-header">
            <h2 id="logo-text">UAS - FIM</h2>
            <p>Ingeniería de Software</p>
        </div>
        
        <div class="menu-container">
            <div class="menu-seccion">Proyectos Base</div>
            <a href="vistas/sistema_fim/dashboard.html" target="marco_trabajos">
                <span class="icon-box">16</span>
                <span class="link-text">Sistema de Préstamos</span>
            </a>
            
            <div class="menu-seccion">Prácticas JavaScript</div>
            <a href="vistas/ejercicios/ej19.html" target="marco_trabajos">
                <span class="icon-box">19</span>
                <span class="link-text">Salidas JS</span>
            </a>
            <a href="vistas/ejercicios/ej20.html" target="marco_trabajos">
                <span class="icon-box">20</span>
                <span class="link-text">Operaciones</span>
            </a>
            <a href="vistas/ejercicios/ej21.html" target="marco_trabajos">
                <span class="icon-box">21</span>
                <span class="link-text">Formularios</span>
            </a>
            <a href="vistas/ejercicios/ej22.html" target="marco_trabajos">
                <span class="icon-box">22</span>
                <span class="link-text">Fórmula General</span>
            </a>
            <a href="vistas/ejercicios/ej23.html" target="marco_trabajos">
                <span class="icon-box">23</span>
                <span class="link-text">Cálculo IMC</span>
            </a>
            <a href="vistas/ejercicios/ej24.html" target="marco_trabajos">
                <span class="icon-box">24</span>
                <span class="link-text">Fechas (Switch)</span>
            </a>
            <a href="vistas/ejercicios/ej25.html" target="marco_trabajos">
                <span class="icon-box">25</span>
                <span class="link-text">Tablas Multiplicar</span>
            </a>
            <a href="vistas/ejercicios/ej26.html" target="marco_trabajos">
                <span class="icon-box">26</span>
                <span class="link-text">Tablas Dinámicas</span>
            </a>
        </div>
    </nav>

    <div class="visor-container">
        <iframe name="marco_trabajos" src="vistas/sistema_fim/dashboard.html"></iframe>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const logoText = document.getElementById('logo-text');
            sidebar.classList.toggle('collapsed');
            
            if (sidebar.classList.contains('collapsed')) {
                logoText.innerText = "FIM";
            } else {
                logoText.innerText = "UAS - FIM";
            }
        }
    </script>
</body>
</html>
